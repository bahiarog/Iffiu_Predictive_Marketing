<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IFFIU — Create Account</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,700;9..40,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#08090d;--surface:rgba(255,255,255,.035);--border:rgba(255,255,255,.08);--text:#e8eaf0;--dim:rgba(232,234,240,.55);--accent:#6ee7b7;--accent2:#818cf8;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse 600px 400px at 30% 20%,rgba(110,231,183,.05),transparent),radial-gradient(ellipse 500px 300px at 70% 60%,rgba(129,140,248,.04),transparent),var(--bg);}
.card{width:100%;max-width:440px;padding:48px;border-radius:20px;background:var(--surface);border:1px solid var(--border);}
.logo{text-align:center;font-size:28px;font-weight:800;margin-bottom:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.sub{text-align:center;font-size:14px;color:var(--dim);margin-bottom:32px;}
.trial-badge{text-align:center;padding:10px;border-radius:10px;background:rgba(110,231,183,.08);border:1px solid rgba(110,231,183,.15);color:var(--accent);font-size:13px;font-weight:600;margin-bottom:24px;}
label{display:block;font-size:13px;font-weight:600;color:var(--dim);margin-bottom:6px;}
input{width:100%;padding:12px 16px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);font-size:15px;margin-bottom:16px;outline:none;transition:border-color .2s;}
input:focus{border-color:var(--accent);}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.btn{width:100%;padding:14px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--accent),#34d399);color:#08090d;font-weight:700;font-size:15px;cursor:pointer;margin-top:8px;}
.links{text-align:center;margin-top:20px;font-size:13px;color:var(--dim);}
.links a{color:var(--accent);text-decoration:none;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">IFFIU</div>
  <div class="sub">Start your Predictive Marketing journey</div>
  <div class="trial-badge">🎉 3 Free Analyses · No Credit Card Required</div>
  <form action="/auth/register" method="POST">
    <div class="row">
      <div><label>Name</label><input type="text" name="name" placeholder="Your name"></div>
      <div><label>Company</label><input type="text" name="company" placeholder="Company name"></div>
    </div>
    <label>Email</label>
    <input type="email" name="email" required placeholder="your@email.com">
    <label>Password</label>
    <input type="password" name="password" required placeholder="Min. 8 characters" minlength="8">
    <button type="submit" class="btn">Create Free Account →</button>
  </form>
  <div class="links">Already have an account? <a href="/login">Sign in</a> · <a href="/">Home</a></div>
</div>
</body>
</html>
