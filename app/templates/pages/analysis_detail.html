<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IFFIU Analysis</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,700;9..40,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>:root{--bg:#08090d;--surface:rgba(255,255,255,.035);--border:rgba(255,255,255,.08);--text:#e8eaf0;--dim:rgba(232,234,240,.55);--accent:#6ee7b7;--accent2:#818cf8;--accent3:#f472b6;--font:"DM Sans",system-ui,sans-serif;--mono:"JetBrains Mono",monospace;}*{box-sizing:border-box;margin:0;padding:0;}body{font-family:var(--font);background:var(--bg);color:var(--text);background:radial-gradient(ellipse 800px 600px at 20% 10%,rgba(110,231,183,.04),transparent 55%),radial-gradient(ellipse 700px 500px at 80% 30%,rgba(129,140,248,.04),transparent 50%),var(--bg);}.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;border-bottom:1px solid var(--border);backdrop-filter:blur(20px);position:sticky;top:0;z-index:100;background:rgba(8,9,13,.85);}.logo{font-size:20px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.btn-sm{padding:8px 18px;border-radius:8px;font-size:13px;font-weight:600;text-decoration:none;background:var(--surface);color:var(--text);border:1px solid var(--border);display:inline-flex;align-items:center;gap:6px;}.dash{max-width:1400px;margin:0 auto;padding:32px;}.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;margin-bottom:24px;}.card-title{font-size:13px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:16px;}.loading{text-align:center;padding:80px;color:var(--dim);}.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px;}@keyframes spin{to{transform:rotate(360deg);}}</style></head><body>
<div class="topbar"><div class="logo">IFFIU</div><a href="/dashboard" class="btn-sm"><i class="fas fa-arrow-left"></i> Dashboard</a></div>
<div class="dash"><div id="ld" class="loading"><div class="spinner"></div><p>Loading results...</p></div><div id="rc" style="display:none;"></div></div>
<script>const cid={{ creative_id }};function sc(v){return v>=70?"#6ee7b7":v>=45?"#fbbf24":"#f472b6";}function sbg(v){return v>=70?"rgba(110,231,183,.12)":v>=45?"rgba(251,191,36,.12)":"rgba(244,114,182,.12)";}
async function load(){try{const r=await fetch("/api/results/"+cid);if(!r.ok)throw new Error("Failed");const d=await r.json();render(d);}catch(e){document.getElementById("ld").innerHTML="<p style=\"color:var(--accent3);\">Failed: "+e.message+"</p>";}}
function render(d){document.getElementById("ld").style.display="none";const c=document.getElementById("rc");c.style.display="block";const o=d.overall||{};const rk=d.rekognition||{};const ps=d.personas||[];const s=o.score||0;
let h='<div class="card"><div class="card-title"><i class="fas fa-brain"></i> IFFIU Score - '+( d.creative?.title||"Creative")+'</div><div style="text-align:center;margin-bottom:24px;"><div style="position:relative;width:160px;height:160px;margin:0 auto 12px;"><svg width="160" height="160" viewBox="0 0 160 160" style="transform:rotate(-90deg);"><circle cx="80" cy="80" r="68" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="7"/><circle cx="80" cy="80" r="68" fill="none" stroke="url(#sg)" stroke-width="7" stroke-dasharray="427" stroke-dashoffset="'+(427-427*s/100)+'" stroke-linecap="round"/><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6ee7b7"/><stop offset="100%" stop-color="#818cf8"/></linearGradient></defs></svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;"><div style="font-size:44px;font-weight:800;font-family:var(--mono);background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;">'+Math.round(s)+'</div><div style="font-size:10px;color:var(--dim);text-transform:uppercase;">Predictive Score</div></div></div><div style="display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:99px;font-size:12px;font-weight:700;background:'+sbg(s)+';color:'+sc(s)+';">\'+(o.risk_level||"-")+' Risk</div></div></div>';
if(ps.length){h+='<div class="card"><div class="card-title"><i class="fas fa-users"></i> Persona Results</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;">';ps.forEach(function(p){const cs=Math.round(p.combined||0);h+='<div style="padding:24px;border-radius:14px;background:var(--surface);border:1px solid var(--border);position:relative;"><div style="position:absolute;top:16px;right:16px;padding:4px 12px;border-radius:8px;font-family:var(--mono);font-weight:700;background:'+sbg(cs)+';color:'+sc(cs)+';">'+cs+'</div><div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;"><div style="width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:'+(p.color||"#818cf8")+'18;">\'+(p.emoji||"?")+'</div><div><div style="font-weight:700;">'+p.name+'</div><div style="font-size:11px;color:var(--dim);">\'+(p.age_range||"")+'</div></div></div><div style="font-size:12px;color:var(--dim);line-height:1.6;">\'+(p.reasoning||"")+'</div></div>';});h+='</div></div>';}c.innerHTML=h;}load();</script></body></html>
