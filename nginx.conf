server {
    listen 80;
    server_name iffiu.com www.iffiu.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name iffiu.com www.iffiu.com;
    ssl_certificate /etc/letsencrypt/live/iffiu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iffiu.com/privkey.pem;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    client_max_body_size 500M;
    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /static/ {
        alias /app/app/static/;
        expires 30d;
    }
}
server {
    listen 80;
    server_name api.iffiu.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name api.iffiu.com;
    ssl_certificate /etc/letsencrypt/live/api.iffiu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.iffiu.com/privkey.pem;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 500M;

    location /dashboard/ {
        alias /var/www/iffiu-dashboard/;
        index index.html;
    }
    location /health {
        proxy_pass http://iffiu-api:8008/health;
        proxy_set_header Host $host;
    }
    location /api/ {
        proxy_pass http://iffiu-api:8008/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /docs {
        proxy_pass http://iffiu-api:8008/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /openapi.json {
        proxy_pass http://iffiu-api:8008/openapi.json;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://iffiu-api:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    server_name negotiatex.ai www.negotiatex.ai;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name negotiatex.ai www.negotiatex.ai;
    ssl_certificate /etc/letsencrypt/live/negotiatex.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/negotiatex.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 30M;

    location /monitoring/ {
        proxy_pass http://negotiatex-grafana:3000/monitoring/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        auth_basic "NegotiateX Monitoring";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }

    location /api/ {
        proxy_pass http://negotiatex-backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
    location = /dashboard {
        root /var/www/negotiatex;
        rewrite ^/dashboard$ /dashboard.html break;
        default_type text/html;
    }
    location = /admin {
        root /var/www/negotiatex;
        rewrite ^/admin$ /admin.html break;
        default_type text/html;
    }
    location = /login {
        root /var/www/negotiatex;
        rewrite ^/login$ /login.html break;
        default_type text/html;
    }
    location = /supplier-portal {
        root /var/www/negotiatex;
        rewrite ^/supplier-portal$ /supplier-portal.html break;
        default_type text/html;
    }
    location = /privacy {
        root /var/www/negotiatex;
        rewrite ^/privacy$ /privacy.html break;
        default_type text/html;
    }

    location = /impressum {
        root /var/www/negotiatex;
        rewrite ^/impressum$ /impressum.html break;
        default_type text/html;
    }


    location /_next {
        proxy_pass http://trading-frontend:3000;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location = /trading {
        return 301 /trading/;
    }

    location /trading/ {
        proxy_pass http://trading-frontend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /trading-api/ {
        proxy_pass http://trading-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /jobs {
        return 301 /jobs/;
    }

    location /jobs/_next/ {
        proxy_pass http://jobs-frontend:3000/_next/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /jobs/ {
        proxy_pass http://jobs-frontend:3000/;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /jobs-api/ {
        proxy_pass http://jobs-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        root /var/www/negotiatex;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
