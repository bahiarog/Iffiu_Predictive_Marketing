version: '3.8'

services:
  app:
    build: .
    container_name: iffiu-app
    restart: always
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
    volumes:
      - uploads:/app/uploads

  db:
    image: postgres:16-alpine
    container_name: iffiu-db
    restart: always
    environment:
      POSTGRES_DB: iffiu
      POSTGRES_USER: iffiu
      POSTGRES_PASSWORD: ${DB_PASSWORD:-iffiu_secret_change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  nginx:
    image: nginx:alpine
    container_name: iffiu-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/iffiu.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
